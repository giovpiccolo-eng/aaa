// ─── STATUS HELPERS ───────────────────────────────────────────────────────────
const S_CYCLE = ["not-started","planning","ready","teaching","complete"];
const S_LABEL = { "not-started":"Not Started", planning:"Planning", ready:"Ready", teaching:"Teaching", complete:"Complete" };
const S_COLOR = {
  "not-started": "bg-gray-200 text-gray-500",
  planning:      "bg-amber-100 text-amber-800 border border-amber-300",
  ready:         "bg-blue-100 text-blue-700 border border-blue-300",
  teaching:      "bg-gold/90 text-white",
  complete:      "bg-navy text-white",
};

function nextS(s) { return S_CYCLE[(S_CYCLE.indexOf(s)+1)%S_CYCLE.length]; }

function StatusPill({ status, onClick }) {
  return (
    <button onClick={onClick} title="Click to cycle status"
      className={`text-xs px-2 py-0.5 rounded small-caps cursor-pointer transition-all ${S_COLOR[status]}`}>
      {S_LABEL[status]}
    </button>
  );
}

function AlignBadge({ aligned }) {
  return aligned
    ? <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-gold text-white small-caps">❧ Aligned</span>
    : <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-amber text-white small-caps">⚠ Needs Attention</span>;
}

function PacingBadge({ pacing }) {
  return pacing === "behind"
    ? <span className="text-xs px-1.5 py-0.5 rounded bg-amber/20 text-amber border border-amber/40 small-caps">Behind</span>
    : <span className="text-xs px-1.5 py-0.5 rounded bg-green-100 text-green-700 small-caps">On Track</span>;
}

// month-in-period matching
function periodIncludes(period, month) {
  return period.split(" / ").includes(month);
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [view, setView]           = useState("dashboard");
  const [month, setMonth]         = useState("November");
  const [yFilter, setYFilter]     = useState("all");
  const [mapYear, setMapYear]     = useState(7);
  const [syncYear, setSyncYear]   = useState(7);
  const [syncKey, setSyncKey]     = useState("y7-nov");
  const [detailTheme, setDetail]  = useState(null);
  const [coord, setCoord]         = useState(COORDINATION_SEED);
  const [noteInputs, setNoteInputs] = useState({});

  const cycleStatus = k => setCoord(c => ({
    ...c, themeStatus: { ...c.themeStatus, [k]: { ...c.themeStatus[k], status: nextS(c.themeStatus[k]?.status||"not-started") } }
  }));
  const togglePacing = k => setCoord(c => ({
    ...c, themeStatus: { ...c.themeStatus, [k]: { ...c.themeStatus[k], pacing: c.themeStatus[k]?.pacing==="behind"?"on-track":"behind" } }
  }));
  const toggleAlign = sk => setCoord(c => ({
    ...c, sync: { ...c.sync, [sk]: { ...c.sync[sk], aligned: !c.sync[sk]?.aligned, reason: c.sync[sk]?.aligned ? "Streams on different topics" : null } }
  }));
  const setReason = (sk, r) => setCoord(c => ({
    ...c, sync: { ...c.sync, [sk]: { ...c.sync[sk], reason: r } }
  }));
  const addNote = (sk, text) => {
    if (!text.trim()) return;
    const now = new Date();
    const ts = `${now.getDate()} ${now.toLocaleString("en",{month:"short"})} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    setCoord(c => ({ ...c, sync: { ...c.sync, [sk]: { ...c.sync[sk], notes: [...(c.sync[sk]?.notes||[]), { author:"Coordinator", ts, text }] } } }));
  };
  const updateAssign = (k, v) => setCoord(c => ({ ...c, assignments: { ...c.assignments, [k]: v } }));

  const openSync = (yearId, sk) => { setSyncYear(yearId); setSyncKey(sk); setView("syncboard"); };

  const MONTHS = ["September","October","November","December","January","February","March","April","May","June"];
  const ctx = { coord, cycleStatus, togglePacing, toggleAlign, setReason, addNote, noteInputs, setNoteInputs, openSync, setDetail, updateAssign };

  return (
    <div className="flex h-screen overflow-hidden" style={{background:"#F4ECD8"}}>
      {/* Sidebar */}
      <aside className="w-52 flex-shrink-0 flex flex-col border-r border-white/10" style={{background:"#1B2A4A"}}>
        <div className="p-4 border-b border-white/10">
          <div className="text-xs small-caps text-gold/70 tracking-widest mb-0.5">Acorn International</div>
          <div className="font-display text-white text-xl font-semibold">Concordance</div>
          <div className="text-xs text-white/40 mt-0.5">Integrated History</div>
        </div>
        <nav className="flex-1 p-3 space-y-0.5">
          {[["dashboard","Dashboard","◈"],["yearmap","Year Map","▦"],["syncboard","Sync Board","⬡"],["staff","Staff & Assignments","⊙"],["assessments","Assessments","◷"]].map(([v,label,icon])=>(
            <button key={v} onClick={()=>setView(v)}
              className={`w-full text-left flex items-center gap-2 px-3 py-2 rounded text-sm transition-all ${view===v?"bg-gold text-navy font-semibold":"text-white/70 hover:bg-white/10 hover:text-white"}`}>
              <span className="opacity-60">{icon}</span>{label}
            </button>
          ))}
        </nav>
        <div className="p-3 border-t border-white/10 space-y-2">
          <div>
            <div className="text-xs small-caps text-white/40 mb-1">Current Month</div>
            <select value={month} onChange={e=>setMonth(e.target.value)} className="w-full text-xs">
              {MONTHS.map(m=><option key={m}>{m}</option>)}
            </select>
          </div>
          <div>
            <div className="text-xs small-caps text-white/40 mb-1">Year Group</div>
            <select value={yFilter} onChange={e=>setYFilter(e.target.value==="all"?"all":parseInt(e.target.value))} className="w-full text-xs">
              <option value="all">All Years</option>
              <option value={7}>Year 7</option>
              <option value={8}>Year 8</option>
              <option value={9}>Year 9</option>
            </select>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="flex-1 overflow-y-auto">
        {view==="dashboard"   && <Dashboard {...ctx} month={month} yFilter={yFilter} />}
        {view==="yearmap"     && <YearMap {...ctx} mapYear={mapYear} setMapYear={setMapYear} />}
        {view==="syncboard"   && <SyncBoard {...ctx} syncYear={syncYear} setSyncYear={setSyncYear} syncKey={syncKey} setSyncKey={setSyncKey} />}
        {view==="staff"       && <StaffView {...ctx} />}
        {view==="assessments" && <AssessmentsView {...ctx} yFilter={yFilter} />}
      </main>

      {/* Theme detail slide-over */}
      {detailTheme && <ThemeDetail {...detailTheme} onClose={()=>setDetail(null)} />}
    </div>
  );
}

  const rows = CURRICULUM.years
    .filter(y => yFilter==="all" || y.id===yFilter)
    .map(y => ({ y, t: y.themes.find(t => periodIncludes(t.period, month)) }))
    .filter(x=>x.t);

  const makeSK = (yearId, t) => `y${yearId}-${t.id.split('-').slice(1).join('-')}`;

  const needsSync = rows.filter(({y,t})=>!(coord.sync[makeSK(y.id,t)]?.aligned??true)).length;
  const assessN   = rows.reduce((n,{t})=>n+(t.british.assessment?1:0)+(t.italian.assessment?1:0),0);

  return (
    <div className="p-8 max-w-4xl mx-auto">
      <h1 className="font-display text-3xl text-navy font-semibold mb-0.5">Dashboard</h1>
      <div className="text-sm small-caps text-navy/50 mb-4">{month} — Coordinator Overview</div>

      {/* Summary strip */}
      <div className="flex flex-wrap gap-4 text-sm bg-parchment-light border border-navy/10 rounded-lg px-5 py-3 mb-6">
        <span><strong>{rows.length}</strong> year-groups</span>

          const sync = coord.sync[sk];
          const aligned = sync?.aligned??true;
          const bK = `${t.id}-british`, iK = `${t.id}-italian`;
          const bS = coord.themeStatus[bK]||{status:"not-started",pacing:"on-track"};
          const iS = coord.themeStatus[iK]||{status:"not-started",pacing:"on-track"};
          const bT = STAFF.find(s=>s.id===coord.assignments[`${y.id}-british`]);
          const iT = STAFF.find(s=>s.id===coord.assignments[`${y.id}-italian`]);

            <div key={y.id} onClick={()=>openSync(y.id,sk)}

              <div className="px-5 py-4">
                <p className="font-display italic text-navy/80 text-base mb-3">"{t.enquiryQuestion}"</p>
                <span className="text-xs px-2 py-0.5 rounded-full border border-gold/50 text-gold small-caps">{t.bridge.concept}</span>
                <div className="grid grid-cols-2 gap-3 mt-3">
                  <div className="stream-b pl-3">
                    <div className="text-xs small-caps text-navy/50 mb-1">British Stream</div>
                    <div className="text-xs text-navy/60 mb-2">{bT?.name||"—"}</div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <StatusPill status={bS.status} onClick={e=>{e.stopPropagation();cycleStatus(bK);}} />
                      <PacingBadge pacing={bS.pacing} />
                    </div>
                  </div>
                  <div className="stream-i pl-3">
                    <div className="text-xs small-caps text-gold/80 mb-1">Italian Stream</div>
                    <div className="text-xs text-navy/60 mb-2">{iT?.name||"—"}</div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <StatusPill status={iS.status} onClick={e=>{e.stopPropagation();cycleStatus(iK);}} />
                      <PacingBadge pacing={iS.pacing} />
                    </div>

                </div>
                {!aligned && sync?.reason && (
                  <div className="mt-3 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded px-3 py-1.5">⚠ {sync.reason}</div>

          );
        })}
      </div>
    </div>
  );
}

// ─── SYNC BOARD ───────────────────────────────────────────────────────────────
function SyncBoard({ coord, syncYear, setSyncYear, syncKey, setSyncKey, cycleStatus, togglePacing, toggleAlign, setReason, addNote, noteInputs, setNoteInputs, setDetail }) {
  const y = CURRICULUM.years.find(yr=>yr.id===syncYear);
  const theme = y?.themes.find(t=>`y${syncYear}-${t.id.split('-').slice(1).join('-')}`===syncKey) || y?.themes[0];
  const sk = theme ? `y${syncYear}-${theme.id.split('-').slice(1).join('-')}` : null;
  const sync = sk ? (coord.sync[sk]||{aligned:true,reason:null,notes:[]}) : null;
  const bK = theme ? `${theme.id}-british` : null;
  const iK = theme ? `${theme.id}-italian` : null;
  const bS = bK ? (coord.themeStatus[bK]||{status:"not-started",pacing:"on-track"}) : {};
  const iS = iK ? (coord.themeStatus[iK]||{status:"not-started",pacing:"on-track"}) : {};
  const bT = STAFF.find(s=>s.id===coord.assignments[`${syncYear}-british`]);
  const iT = STAFF.find(s=>s.id===coord.assignments[`${syncYear}-italian`]);

  const REASONS = ["Streams on different topics","Italian stream behind","British stream behind","Assessment clash","Resources not ready"];

  const jumpToYear = (yId) => {
    setSyncYear(yId);
    const yr = CURRICULUM.years.find(y=>y.id===yId);
    if (yr) {
      const t = yr.themes.find(th=>periodIncludes(th.period,"November"))||yr.themes[0];
      setSyncKey(`y${yId}-${t.id.split('-').slice(1).join('-')}`);
    }
  };

  return (
    <div className="p-6 max-w-5xl mx-auto">
      <div className="flex items-end justify-between mb-4">
        <div>
          <h1 className="font-display text-3xl text-navy font-semibold">Sync Board</h1>
          <p className="text-sm small-caps text-navy/50">Integration Contract Monitor</p>
        </div>
        <div className="flex gap-1">
          {[7,8,9].map(n=>(
            <button key={n} onClick={()=>jumpToYear(n)}
              className={`px-3 py-1.5 rounded small-caps text-sm transition-all ${syncYear===n?"bg-navy text-parchment":"bg-navy/10 text-navy hover:bg-navy/20"}`}>
              Year {n}
            </button>
          ))}
        </div>
      </div>

      {/* Month strip */}
      {y && (
        <div className="flex gap-1.5 mb-5 overflow-x-auto pb-1">
          {y.themes.map(t=>{
            const tsk = `y${syncYear}-${t.id.split('-').slice(1).join('-')}`;
            const al  = coord.sync[tsk]?.aligned ?? true;
            const isA = tsk===sk;
            return (
              <button key={t.id} onClick={()=>setSyncKey(tsk)}
                className={`flex-shrink-0 px-3 py-1.5 rounded text-xs small-caps transition-all border ${
                  isA?"border-navy bg-navy text-white":
                  al?"border-gold/30 bg-gold/10 text-navy hover:bg-gold/20":"border-amber/40 bg-amber/10 text-amber-800 hover:bg-amber/20"
                }`}>
                {t.period}{!al&&" ⚠"}
              </button>
            );
          })}
        </div>
      )}

      {theme && sync && (
        <>
          {/* Contract banner */}
          <div className="rounded-xl overflow-hidden mb-5 border border-navy/20" style={{background:"#1B2A4A"}}>
            <div className="px-6 py-5">
              <div className="text-xs small-caps text-white/40 tracking-widest mb-2">{theme.period} · Integration Contract</div>
              <p className="font-display italic text-white text-xl leading-snug mb-4">"{theme.enquiryQuestion}"</p>
              <div className="flex items-start gap-3">
                <div className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold text-white flex-shrink-0" style={{background:"#B8893A"}}>
                  {theme.bridge.concept.slice(0,2)}
                </div>
                <div>
                  <div className="text-xs small-caps text-gold">{theme.bridge.concept}</div>
                  <div className="text-xs text-white/60 mt-0.5">{theme.bridge.gloss}</div>
                </div>
              </div>
            </div>
            <div className="border-t border-white/10 px-6 py-3 flex items-start gap-2" style={{background:"rgba(255,255,255,0.04)"}}>
              <span className="text-gold flex-shrink-0">❧</span>
              <p className="text-sm italic text-white/70">{theme.crossStream}</p>
            </div>
          </div>

          {/* Stream panels */}
          <div className="grid grid-cols-[1fr_56px_1fr] mb-5">
            {/* British */}
            <div className="rounded-l-xl border border-r-0 border-navy/20 overflow-hidden" style={{background:"#FAF6EE"}}>
              <div className="px-4 py-3 border-b border-navy/10 border-l-4 border-l-navy flex items-center justify-between">
                <div>
                  <div className="text-xs small-caps text-navy/50">British Stream</div>
                  <div className="text-sm font-semibold text-navy">{bT?.name||"Unassigned"}</div>
                </div>
                <div className="flex flex-col items-end gap-1">
                  <StatusPill status={bS.status} onClick={()=>cycleStatus(bK)} />
                  <button onClick={()=>togglePacing(bK)}><PacingBadge pacing={bS.pacing} /></button>
                </div>
              </div>
              <div className="p-4 space-y-3 text-sm">
                <div><div className="text-xs small-caps text-navy/40 mb-0.5">Topics</div><p className="text-navy/80 leading-relaxed">{theme.british.topics}</p></div>
                <div><div className="text-xs small-caps text-navy/40 mb-0.5">Key Assessment</div><p className="text-navy/70 italic">{theme.british.assessment}</p></div>
              </div>
            </div>

            {/* Seam */}
            <div className="flex flex-col items-center justify-center gap-3">
              <div className="text-gold text-2xl">❧</div>
              <button onClick={()=>toggleAlign(sk)}
                className={`w-9 h-9 rounded-full border-2 flex items-center justify-center text-base transition-all ${sync.aligned?"border-gold bg-gold/20 text-gold":"border-amber bg-amber/20 text-amber"}`}
                title="Toggle alignment">
                {sync.aligned?"✓":"⚠"}
              </button>
              <div className="text-gold text-2xl" style={{transform:"scaleY(-1)"}}>❧</div>
            </div>

            {/* Italian */}
            <div className="rounded-r-xl border border-l-0 border-navy/20 overflow-hidden" style={{background:"#FAF6EE"}}>
              <div className="px-4 py-3 border-b border-gold/20 border-l-4 border-l-gold flex items-center justify-between">
                <div>
                  <div className="text-xs small-caps text-gold/70">Italian Stream</div>
                  <div className="text-sm font-semibold text-navy">{iT?.name||"Unassigned"}</div>
                </div>
                <div className="flex flex-col items-end gap-1">
                  <StatusPill status={iS.status} onClick={()=>cycleStatus(iK)} />
                  <button onClick={()=>togglePacing(iK)}><PacingBadge pacing={iS.pacing} /></button>
                </div>
              </div>
              <div className="p-4 space-y-3 text-sm">
                <div><div className="text-xs small-caps text-gold/60 mb-0.5">Topics</div><p className="text-navy/80 leading-relaxed">{theme.italian.topics}</p></div>
                <div><div className="text-xs small-caps text-gold/60 mb-0.5">Key Assessment</div><p className="text-navy/70 italic">{theme.italian.assessment}</p></div>
              </div>
            </div>
          </div>

          {/* Reason picker */}
          {!sync.aligned && (
            <div className="mb-4 rounded-lg border border-amber/30 p-4" style={{background:"rgba(199,125,58,0.06)"}}>
              <div className="text-xs small-caps text-amber mb-2">Reason for Sync Issue</div>
              <div className="flex flex-wrap gap-2">
                {REASONS.map(r=>(
                  <button key={r} onClick={()=>setReason(sk,r)}
                    className={`text-xs px-3 py-1 rounded-full border transition-all ${sync.reason===r?"bg-amber text-white border-amber":"border-amber/40 text-amber-800 hover:bg-amber/10"}`}>
                    {r}
                  </button>
                ))}
              </div>
              {sync.reason && <p className="text-xs text-amber-800 mt-2">Selected: <strong>{sync.reason}</strong></p>}
            </div>
          )}

          {/* Notes */}
          <div className="rounded-xl border border-navy/15 overflow-hidden" style={{background:"#FAF6EE"}}>
            <div className="px-5 py-3 border-b border-navy/10 flex items-center justify-between">
              <span className="text-xs small-caps text-navy/50">Shared Coordination Notes</span>
              <span className="text-xs text-navy/30">Both teachers see this</span>
            </div>
            <div className="p-4 space-y-3 max-h-44 overflow-y-auto">
              {(sync.notes||[]).map((n,i)=>(
                <div key={i}>
                  <span className="text-sm font-semibold text-navy">{n.author}</span>
                  <span className="text-xs text-navy/40 ml-2">{n.ts}</span>
                  <p className="text-sm text-navy/80 mt-0.5 leading-relaxed">{n.text}</p>
                </div>
              ))}
              {!sync.notes?.length && <p className="text-navy/30 text-sm italic">No notes yet.</p>}
            </div>
            <div className="border-t border-navy/10 p-3 flex gap-2">
              <input value={noteInputs[sk]||""} onChange={e=>setNoteInputs(n=>({...n,[sk]:e.target.value}))}
                onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){addNote(sk,noteInputs[sk]||"");setNoteInputs(n=>({...n,[sk]:""}));}}}
                placeholder="Add a note… (Enter to send)"
                className="flex-1 text-sm bg-white border border-navy/20 rounded px-3 py-1.5 focus:outline-none focus:border-gold/60"
              />
              <button onClick={()=>{addNote(sk,noteInputs[sk]||"");setNoteInputs(n=>({...n,[sk]:""}));}}
                className="px-4 py-1.5 bg-navy text-white text-sm rounded hover:bg-navy-light transition-all">
                Send
              </button>
            </div>
          </div>
          <div className="mt-2 text-right">
            <button onClick={()=>setDetail({theme,yearId:syncYear})}
              className="text-xs text-gold underline hover:text-gold/70">
              View full theme detail →
            </button>
          </div>
        </>
      )}
    </div>
  );
}

            </div>
            <div className="flex flex-wrap gap-2">
              <span className={`text-xs px-2 py-0.5 rounded-full small-caps text-white ${t.stream==="british"?"bg-navy":"bg-gold"}`}>
                {t.stream==="british"?"British Stream":"Italian Stream"}
              </span>
              {t.years.map(n=><span key={n} className="text-xs px-2 py-0.5 rounded-full bg-navy/10 text-navy">Year {n}</span>)}
            </div>
          </div>
        ))}
      </div>

      <h2 className="font-display text-xl text-navy font-semibold mb-3">Assignment Matrix</h2>
      <div className="rounded-xl border border-navy/15 overflow-hidden" style={{background:"#FAF6EE"}}>
        <table className="w-full text-sm">
          <thead>
            <tr className="border-b border-navy/10" style={{background:"rgba(27,42,74,0.06)"}}>
              <th className="text-left px-4 py-2.5 text-xs small-caps text-navy/50">Year</th>
              <th className="text-left px-4 py-2.5 text-xs small-caps text-navy/50">British Stream</th>
              <th className="text-left px-4 py-2.5 text-xs small-caps text-gold/70">Italian Stream</th>
            </tr>
          </thead>
          <tbody>
            {[7,8,9].map((n,i)=>{
              const yr = CURRICULUM.years.find(y=>y.id===n);
              return (
                <tr key={n} className={`border-b border-navy/5 ${i%2===1?"bg-navy/[0.02]":""}`}>
                  <td className="px-4 py-3 font-semibold text-navy">Year {n} <span className="text-navy/40 font-normal text-xs">({yr?.label})</span></td>
                  <td className="px-4 py-3">
                    <select value={coord.assignments[`${n}-british`]||""} onChange={e=>updateAssign(`${n}-british`,e.target.value)}>
                      <option value="">— Unassigned —</option>
                      {STAFF.filter(s=>s.stream==="british").map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  </td>
                  <td className="px-4 py-3">
                    <select value={coord.assignments[`${n}-italian`]||""} onChange={e=>updateAssign(`${n}-italian`,e.target.value)}>
                      <option value="">— Unassigned —</option>
                      {STAFF.filter(s=>s.stream==="italian").map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-navy/40 mt-2 italic">Assignment changes persist for this session only — persistence requires the real-build database layer.</p>
    </div>
  );
}

// ─── ASSESSMENTS ──────────────────────────────────────────────────────────────
function AssessmentsView({ coord, yFilter }) {
  const [sf, setSf] = useState("all");
  const MO = ["September","October","November","December","January","February","March","April","May","June"];

  const firstMonth = period => {
    const parts = period.split(" / ");
    return MO.indexOf(parts[0]);
  };

  const items = [];
  CURRICULUM.years.forEach(y=>{
    if (yFilter!=="all" && y.id!==yFilter) return;
    y.themes.forEach(t=>{
      if (sf!=="italian" && t.british.assessment)
        items.push({ mi:firstMonth(t.period), period:t.period, yId:y.id, yLabel:y.label, stream:"british", title:t.british.assessment, sk:`${t.id}-british`, themeTitle:t.title });
      if (sf!=="british" && t.italian.assessment)
        items.push({ mi:firstMonth(t.period), period:t.period, yId:y.id, yLabel:y.label, stream:"italian", title:t.italian.assessment, sk:`${t.id}-italian`, themeTitle:t.title });
    });
  });
  items.sort((a,b)=>a.mi-b.mi||a.yId-b.yId);

  return (
    <div className="p-8 max-w-3xl mx-auto">
      <h1 className="font-display text-3xl text-navy font-semibold mb-0.5">Assessments</h1>
      <p className="text-sm small-caps text-navy/50 mb-4">All key assessments — derived from curriculum</p>
      <div className="flex items-center gap-2 mb-6">
        <span className="text-xs small-caps text-navy/50">Stream:</span>
        {[["all","All Streams"],["british","British"],["italian","Italian"]].map(([v,l])=>(
          <button key={v} onClick={()=>setSf(v)}
            className={`text-xs px-3 py-1 rounded small-caps transition-all ${sf===v?"bg-navy text-white":"bg-navy/10 text-navy hover:bg-navy/20"}`}>
            {l}
          </button>
        ))}
      </div>
      <div className="space-y-2">
        {items.map((item,i)=>{
          const status = coord.themeStatus[item.sk]?.status||"not-started";
          return (
            <div key={i} className="flex items-start gap-4 p-4 rounded-lg border border-navy/10 hover:border-gold/30 transition-all" style={{background:"#FAF6EE"}}>
              <div className="w-28 flex-shrink-0 text-center">
                <div className="text-xs small-caps text-navy/40">{item.period}</div>
                <div className="text-xs text-navy/50 mt-0.5">Year {item.yId}</div>
              </div>
              <div className={`w-0.5 self-stretch rounded ${item.stream==="british"?"bg-navy":"bg-gold"}`} />
              <div className="flex-1">
                <div className="text-xs small-caps mb-0.5" style={{color:item.stream==="british"?"#1B2A4A":"#B8893A"}}>
                  {item.stream==="british"?"British Stream":"Italian Stream"}
                </div>
                <div className="text-xs text-navy/40 mb-1">{item.themeTitle}</div>
                <p className="text-sm text-navy/80 leading-relaxed">{item.title}</p>
              </div>
              <div className="flex-shrink-0"><StatusPill status={status} onClick={()=>{}} /></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
